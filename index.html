<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cho Eunseo — 3D Portfolio</title>
<meta name="description" content="3D 아티스트 조은서의 포트폴리오. 하드서피스 프롭, 환경 애셋, 스컬프트 작업 아카이브.">
<meta property="og:title" content="Cho Eunseo — 3D Portfolio">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17191b; --bg-deep:#0e0f10; --panel:#1f2225; --panel-2:#25292d;
  --line:#33383d; --line-soft:#282c30;
  --ink:#eceae6; --ink-dim:#b4b8bb; --muted:#83888e;
  --accent:#7fb8c4; --accent-deep:#2e4950;
  --pad:clamp(18px,3.4vw,70px);
  --maxw:min(2200px,100%);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
/* 움직임 줄이기 설정에서도 호버 전환과 배경 영상은 그대로 둡니다.
   (스크롤만 부드러운 이동을 끕니다) */
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Archivo","Noto Sans KR",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
body.locked{overflow:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:12px;z-index:200;background:var(--panel);padding:10px 14px;border:1px solid var(--line)}

/* ---------- topbar ---------- */
.topbar{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;align-items:center;gap:20px;
  padding:14px var(--pad);backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(14,15,16,.94),rgba(14,15,16,0))}
.brand{font-weight:800;letter-spacing:.16em;font-size:clamp(14px,.8vw,17px)}
.brand em{font-style:normal;color:var(--accent)}
.nav{display:flex;gap:clamp(18px,1.4vw,28px);margin-left:auto;font-size:clamp(13px,.76vw,16px);letter-spacing:.08em;color:var(--ink-dim);text-transform:uppercase}
.nav button{padding:4px 0;border-bottom:1px solid transparent;transition:.15s}
.nav button:hover,.nav button.on{color:var(--ink);border-bottom-color:var(--accent)}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden}
.hero-media{position:absolute;inset:0;background:#0c0d0e}
.hero-media img,.hero-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity 1.1s ease;filter:saturate(.9) contrast(1.02)}
.hero-media img.ready,.hero-media video.ready{opacity:.75}
.hero-media::after{content:"";position:absolute;inset:0;
  background:radial-gradient(130% 95% at 76% 14%,rgba(0,0,0,0) 0%,rgba(12,13,14,.55) 62%,rgba(20,22,24,.92) 100%)}
.hero-inner{position:relative;padding:0 var(--pad) clamp(46px,9vh,104px);max-width:var(--maxw);width:100%;margin:0 auto}
.hero h1{margin:0;font-size:clamp(46px,11.5vw,190px);line-height:.86;font-weight:800;letter-spacing:-.035em;text-transform:uppercase}
.hero .ko{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:16px;font-size:clamp(14.5px,.85vw,18px);color:var(--ink-dim)}
.hero .ko .nm{letter-spacing:.24em}
.hero .ko .sep{width:1px;height:13px;background:var(--line);flex:none}
.hero .ko .mail{padding:0;color:var(--muted);letter-spacing:.01em;border-bottom:1px solid transparent;transition:.16s}
.hero .ko .mail:hover{color:var(--accent);border-bottom-color:var(--accent-deep)}
.hero .role{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 22px;margin-top:26px}
.hero .role b{flex:none;margin-top:5px;font-weight:600;color:var(--accent);letter-spacing:.14em;text-transform:uppercase;font-size:clamp(12.5px,.72vw,15px)}
.hero .role .htag{font-size:clamp(16.5px,1vw,21px);line-height:1.55;color:var(--ink-dim);letter-spacing:.005em;max-width:60ch}
.hero .role .htag span{display:block;white-space:nowrap}
@media(max-width:560px){.hero .ko .sep{display:none}.hero .role .htag{font-size:14.5px}.hero .role .htag span{white-space:normal}}
.hero-scroll{margin-top:32px;font-size:12px;letter-spacing:.14em;color:var(--muted);display:flex;align-items:center;gap:12px;text-transform:uppercase}
.hero-scroll i{display:block;width:44px;height:1px;background:var(--muted)}

/* ---------- sections ---------- */
.section{padding:clamp(56px,9vh,120px) var(--pad);max-width:var(--maxw);margin:0 auto;scroll-margin-top:64px}
.section-head{display:flex;align-items:baseline;gap:16px;margin-bottom:32px;border-bottom:1px solid var(--line-soft);padding-bottom:14px}
.section-head h2{margin:0;font-size:clamp(22px,2.4vw,42px);font-weight:600;letter-spacing:-.01em}
.section-head .count{font-size:clamp(12px,.72vw,14.5px);letter-spacing:.1em;color:var(--muted);margin-left:auto;text-transform:uppercase}

/* ---------- about ---------- */
.linkbtn{border-bottom:1px solid var(--accent-deep);transition:.15s}
.linkbtn:hover{border-bottom-color:var(--accent);color:var(--accent)}

/* 프로필 + 소개문 */
.about-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.portrait{margin:0;width:clamp(120px,11vw,230px);aspect-ratio:1;border-radius:50%;overflow:hidden;
  background:var(--panel);border:1px solid var(--line-soft);flex:none}
.portrait img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.portrait img.ready{opacity:1}
.who h3{margin:0;font-size:clamp(22px,2vw,38px);font-weight:600;letter-spacing:-.015em}
.who h3 span{color:var(--muted);font-weight:400;font-size:.62em;letter-spacing:.12em;margin-left:10px;
  vertical-align:.14em}
.who .role{margin:8px 0 0;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.who .focus{margin:6px 0 0;font-size:clamp(14px,.82vw,16.5px);color:var(--muted);word-break:keep-all}
.who .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:14px 0 0;font-size:clamp(14px,.82vw,16.5px);color:var(--ink-dim)}
.who .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--line);flex:none}
.about-copy{margin-top:26px}
.about-copy p{margin:0 0 16px;max-width:52em;color:var(--ink);font-size:clamp(15.5px,.98vw,19.5px);
  line-height:1.85;word-break:keep-all}
.about-copy br{line-height:0}
.about-copy p:last-child{margin-bottom:0}

/* Education / Skills / Awards */
.about-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(22px,3.5vw,56px);
  margin-top:clamp(40px,6vh,72px);padding-top:clamp(28px,4vh,44px);border-top:1px solid var(--line-soft)}
.col h4{margin:0 0 16px;font-size:clamp(11.5px,.7vw,13.5px);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.col ul{margin:0;padding:0;list-style:none}
.col li{display:flex;gap:14px;padding:7px 0;font-size:clamp(14.5px,.85vw,17px);color:var(--ink-dim);word-break:keep-all}
.col li .when{flex:none;width:clamp(60px,4.4vw,78px);color:var(--muted);font-variant-numeric:tabular-nums;font-size:clamp(13.5px,.8vw,16px);padding-top:1px}
.skillset{margin-bottom:18px}
.skillset:last-child{margin-bottom:0}
.skillset b{display:block;font-size:clamp(11.5px,.7vw,13.5px);letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin-bottom:7px;opacity:.85}
.skillset p{margin:0;font-size:clamp(14.5px,.85vw,17px);line-height:1.7;color:var(--ink-dim)}
@media(max-width:900px){.about-cols{grid-template-columns:1fr 1fr}.col.awards{grid-column:1/-1}}
@media(max-width:620px){
  .about-top{grid-template-columns:1fr;gap:22px}
  .about-cols{grid-template-columns:1fr;gap:34px}
  .col.awards{grid-column:auto}
}

/* ---------- works ---------- */
/* Designer 등 별도 섹션의 이미지 타일 */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(8px,.9vw,20px)}
@media(max-width:1200px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:900px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{position:relative;display:block;width:100%;padding:0;border:1px solid var(--line-soft);
  background:var(--panel);overflow:hidden;aspect-ratio:1}
.tile img{width:100%;height:100%;object-fit:cover;opacity:0;will-change:transform;
  transition:transform 1.2s cubic-bezier(.33,0,.15,1),opacity .45s}
.tile img.ready{opacity:1}
.tile:hover img,.tile:focus-visible img{transform:scale(1.05)}
.tile::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,0);transition:.2s}
.tile:hover::after{box-shadow:inset 0 0 0 1px rgba(127,184,196,.45)}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.3vw,26px)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.card{position:relative;display:block;width:100%;padding:0;border:1px solid var(--line-soft);
  background:var(--panel);overflow:hidden;aspect-ratio:4/3;text-align:left}
.card::before{content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,#22262a,#1a1d20);}
/* 평소에는 1.4배로 당겨서 보여주고, 마우스를 올리면 원래 크기로 물러나 전체가 보입니다 */
.card img{position:relative;width:100%;height:100%;object-fit:cover;opacity:0;
  transform:scale(1.17);transform-origin:center;
  will-change:transform;backface-visibility:hidden;
  transition:transform 1s cubic-bezier(.33,0,.15,1),opacity .45s}
.card img.ready{opacity:1}
.card:hover img,.card:focus-visible img{transform:scale(1)}
/* 평소에는 날짜까지 전부 보이고, 마우스를 올리면 문구가 사라집니다 */
.card .meta{position:absolute;inset:auto 0 0 0;padding:clamp(48px,4vw,72px) clamp(18px,1.3vw,26px) clamp(14px,1vw,20px);pointer-events:none;
  background:linear-gradient(180deg,rgba(10,11,12,0),rgba(10,11,12,.92));
  opacity:1;transition:opacity .55s cubic-bezier(.33,0,.15,1)}
.card:hover .meta,.card:focus-visible .meta{opacity:0}
.card .date{display:block;font-size:clamp(13.5px,.8vw,16px);letter-spacing:.1em;color:var(--accent);
  text-transform:uppercase}
.card .title{display:block;font-size:clamp(18.5px,1.12vw,26px);font-weight:600;letter-spacing:0;margin-top:3px;line-height:1.25}
.card .sub{display:block;font-size:clamp(14.2px,.85vw,18px);color:var(--muted);letter-spacing:.04em;margin-top:4px}
.card .badges{position:absolute;top:10px;left:10px;display:flex;gap:6px}
.tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;
  background:rgba(10,11,12,.72);border:1px solid var(--line);color:var(--ink-dim)}
.tag.new{background:var(--accent);border-color:var(--accent);color:#0f272c;font-weight:700}
.sentinel{height:60px}
.empty{padding:40px 0;color:var(--muted);font-size:14px}

/* ---------- footer ---------- */
.footer{border-top:1px solid var(--line-soft);padding:34px var(--pad) 46px;max-width:var(--maxw);margin:0 auto;
  display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;font-size:13px;color:var(--muted)}
.footer .acts{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.footer .acts button,.footer .acts a{border:1px solid var(--line);padding:8px 16px;border-radius:999px;
  color:var(--ink-dim);font-size:13px;transition:.16s}
.footer .acts button:hover,.footer .acts a:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:120;display:none;background:rgba(8,9,10,.975);backdrop-filter:blur(8px)}
.lb.open{display:flex}

/* 왼쪽 : 이미지 무대 */
/* 버튼 줄은 이미지 폭(--mw)에 맞춰 이미지와 한 덩어리로 묶입니다 */
.lb-stage{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:9px;padding:clamp(12px,1.3vw,20px)}
.lb-top,.lb-bottom{flex:none;display:flex;align-items:center;gap:16px;min-height:32px;
  width:var(--mw,100%);max-width:100%}
.lb-btn{padding:6px 13px;border:1px solid var(--line);color:var(--ink-dim);
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;transition:.16s;white-space:nowrap}
.lb-btn:hover{border-color:var(--accent);color:var(--accent)}
.lb-btn[disabled]{opacity:.3;pointer-events:none}
.lb-top .idx{margin-left:auto;font-size:12px;letter-spacing:.14em;color:var(--muted);font-variant-numeric:tabular-nums}
.lb-bottom .lb-vars{margin:0 auto}
.lb-bottom #lbNext{margin-left:auto}
.lb-bottom .lb-vars + #lbNext{margin-left:0}

/* 테두리를 이미지에 직접 둘러 위아래·좌우 빈 공간이 보이지 않습니다 */
.lb-frame{position:relative;flex:1 1 auto;min-height:0;width:100%;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
/* 이미지는 프레임을 꽉 채우고, 누르고 있는 동안만 확대됩니다 */
.lb-stage img{max-width:100%;max-height:100%;display:block;
  object-fit:contain;opacity:0;cursor:grab;border:1px solid var(--line-soft);
  touch-action:none;user-select:none;-webkit-user-drag:none;
  transform-origin:center center;
  transition:opacity .3s,transform .35s cubic-bezier(.33,0,.15,1)}
.lb-stage img.ready{opacity:1}
.lb-stage img.zoom{cursor:grabbing}
.lb-stage video{max-width:100%;max-height:100%;display:block;object-fit:contain;opacity:0;
  border:1px solid var(--line-soft);
  transition:opacity .3s;background:#000}
.lb-stage video.ready{opacity:1}
.lb-spin{position:absolute;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}

.lb-vars{display:flex;gap:6px}
.lb-vars button{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:7px 14px;
  border:1px solid var(--line);color:var(--muted);transition:.15s;line-height:1.3}
.lb-vars button:hover{color:var(--ink);border-color:var(--accent-deep)}
.lb-vars button.on{background:var(--accent);border-color:var(--accent);color:#0f272c;font-weight:600}

/* 오른쪽 : 정보 패널 */
.lb-side{width:clamp(230px,19%,430px);flex:none;display:flex;flex-direction:column;min-height:0;
  border-left:1px solid var(--line-soft);background:rgba(13,14,15,.7)}
.lb-info{padding:clamp(18px,1.8vw,24px) clamp(15px,1.2vw,19px) 18px;overflow-y:auto;flex:none;max-height:54%}
.lb-info .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted)}
.lb-info .meta .cat{color:var(--accent)}
.lb-info h3{margin:10px 0 0;font-size:clamp(23px,2.1vw,34px);font-weight:800;line-height:1.05;
  letter-spacing:-.01em;text-transform:uppercase;color:var(--ink)}
.lb-info .desc{margin:15px 0 0;font-size:clamp(14px,.95vw,16.5px);line-height:1.6;color:var(--ink-dim);
  word-break:keep-all}
.lb-info .desc:empty{display:none}
.lb-info .desc .line{display:block}
.lb-info .desc .line.gap-sm{margin-top:.7em}   /* 문장 끝 줄바꿈 */
.lb-info .desc .line.gap-lg{margin-top:1.6em}  /* 빈 줄(문단 나눔) */
.specs{margin:24px 0 0;border-top:1px solid var(--line-soft)}
.specs:empty{display:none}
.specs div{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.specs dt{flex:none;width:58px;color:var(--muted);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;padding-top:3px}
.specs dd{margin:0;color:var(--ink-dim);font-size:clamp(12.5px,.82vw,14.5px);line-height:1.6;word-break:keep-all}

/* 썸네일 목록 */
.lb-rail{flex:1;min-height:0;overflow-y:auto;padding:16px clamp(12px,0.9vw,15px) 18px;
  display:grid;grid-template-columns:1fr;grid-auto-rows:auto;gap:11px;align-content:start;
  border-top:1px solid var(--line-soft);scrollbar-width:thin;cursor:grab;touch-action:none;
  user-select:none;-webkit-user-drag:none}
.lb-rail img{-webkit-user-drag:none}
.lb-rail.dragging{cursor:grabbing}
/* 16:10 비율을 padding 으로 잡아야 그리드 줄 높이에 정확히 반영됩니다 */
.lb-rail button{position:relative;display:block;width:100%;height:0;padding:62.5% 0 0;
  text-align:left;border:1px solid var(--line-soft);
  background:var(--panel);transition:.16s;overflow:hidden}
.lb-rail button .sh{position:absolute;inset:0;display:block;overflow:hidden}
.lb-rail button img{width:100%;height:100%;object-fit:cover;opacity:.55;transition:.2s}
.lb-rail button:hover{border-color:var(--accent-deep)}
.lb-rail button:hover img{opacity:.85}
.lb-rail button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lb-rail button.on img{opacity:1}
.lb-rail button.vid .sh{position:relative}
.lb-rail button.vid .sh::after{content:"▶";position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);width:26px;height:26px;display:flex;align-items:center;
  justify-content:center;font-size:11px;color:#eceae6;background:rgba(10,11,12,.6);
  border:1px solid rgba(236,234,230,.5);border-radius:50%;padding-left:2px}

@media(max-width:920px){
  .lb.open{flex-direction:column}
  .lb-side{width:auto;flex:none;max-height:46%;border-left:0;border-top:1px solid var(--line-soft);
    flex-direction:row;align-items:stretch}
  .lb-info{max-height:none;flex:1;padding:18px 18px 20px}
  .lb-info h3{font-size:24px}
  .lb-rail{flex:none;width:150px;border-top:0;border-left:1px solid var(--line-soft);
    padding:18px 14px;grid-template-columns:1fr;grid-auto-rows:auto;align-content:start}
  .lb-btn{padding:8px 14px;letter-spacing:.14em}
}
@media(max-width:560px){
  .lb-side{max-height:52%;flex-direction:column}
  .lb-rail{width:auto;flex:none;max-height:150px;display:flex;flex-direction:row;gap:10px;border-left:0;
    border-top:1px solid var(--line-soft);padding:12px 16px}
  .lb-rail button{width:150px;flex:none;height:0;padding:62.5% 0 0}
}

/* 색 버전이 있는 타일 표시 */
.tile .vmark{position:absolute;top:9px;right:9px;display:flex;align-items:center;gap:5px;
  padding:3px 8px;background:rgba(10,11,12,.72);border:1px solid var(--line);
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);z-index:200;
  background:#fff;color:#15181a;padding:16px 30px;border-radius:6px;font-size:14.5px;font-weight:600;
  box-shadow:0 22px 60px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.22s ease}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.totop{position:fixed;right:20px;bottom:20px;z-index:55;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:rgba(20,22,24,.85);color:var(--ink-dim);
  opacity:0;pointer-events:none;transition:.2s}
.totop.show{opacity:1;pointer-events:auto}
.totop:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<a class="skip" href="#works">본문으로 건너뛰기</a>

<header class="topbar">
  <div class="brand" id="brand"></div>
  <nav class="nav">

<script src="data.js"></script>
<script>
(function(){
"use strict";
const $  = s => document.querySelector(s);
const el = (t,c) => { const n=document.createElement(t); if(c) n.className=c; return n; };
const enc = p => p.split("/").map(encodeURIComponent).join("/");
const nImg = n => n + (n===1 ? " image" : " images");
const useThumbs = (typeof USE_THUMBS!=="undefined") && USE_THUMBS;
const useWeb    = (typeof USE_WEB!=="undefined")    && USE_WEB;
const dirThumb  = (typeof THUMB_DIR!=="undefined")  ? THUMB_DIR : "thumbs";
const dirWeb    = (typeof WEB_DIR!=="undefined")    ? WEB_DIR   : "web";

/* ---------- 경로 ---------- */
function joinDir(cat,g){ return g.folder ? cat.dir + "/" + g.folder : cat.dir; }
function relDir(cat,g){ return joinDir(cat,g).replace(/^images\//,""); }
function jpgName(file){ return file.replace(/\.[^.]+$/,"") + ".jpg"; }
/* 원본 (images/…) — 축소본이 없을 때의 예비용 */
function origSrc(cat,g,file){ return enc(joinDir(cat,g) + "/" + file); }
/* 라이트박스용 (web/…) */
function fullSrc(cat,g,file){
  return useWeb ? enc(dirWeb + "/" + relDir(cat,g) + "/" + jpgName(file)) : origSrc(cat,g,file);
}
/* 카드·썸네일용 (thumbs/…) */
function thumbSrc(cat,g,file){
  return useThumbs ? enc(dirThumb + "/" + relDir(cat,g) + "/" + jpgName(file)) : origSrc(cat,g,file);
}

/* ---------- 작업 목록 만들기 ---------- */
const WORKS = [];
CATEGORIES.forEach(cat=>{
  (cat.groups||[]).forEach((g,gi)=>{
    if(!g.files || !g.files.length) return;
    /* cover 는 이미지 파일 이름이어야 합니다 */
    const cover = g.cover && g.files.indexOf(g.cover)>=0 ? g.cover : g.files[0];
    WORKS.push({
      id: cat.id+"/"+(g.folder||"_")+"/"+gi,
      cat, group:g,
      title: g.title || g.folder || cat.label,
      date: g.date || "",
      sort: (g.date||"0000").replace("-",""),
      cover,
      coverSrc: thumbSrc(cat,g,cover),
      images: g.files.map(f=>{
        if(f && typeof f==="object" && f.video){          // 영상 항목
          const po=f.poster||cover;
          return { file:f.video, isVideo:true, label:f.label||"",
                   src:enc(f.video), thumb:thumbSrc(cat,g,po), orig:origSrc(cat,g,po) };
        }
        return { file:f, src:fullSrc(cat,g,f), thumb:thumbSrc(cat,g,f), orig:origSrc(cat,g,f) };
      })
    });
  });
});
WORKS.sort((a,b)=> b.sort.localeCompare(a.sort));

/* 카테고리별 이미지 평면 목록 (라이트박스 이동용) */
const FLAT = {};
CATEGORIES.forEach(c=>{ FLAT[c.id]=[]; });
WORKS.forEach(w=>{ w.images.forEach((im,i)=> FLAT[w.cat.id].push({work:w, img:im, i})); });

/* ---------- 조회수 (브라우저 저장, 서버 없음) ---------- */
const VKEY="cho_views", SKEY="cho_seen";
let views={}, seen={};
try{ views=JSON.parse(localStorage.getItem(VKEY)||"{}"); }catch(e){}
try{ seen =JSON.parse(sessionStorage.getItem(SKEY)||"{}"); }catch(e){}
function bump(key){
  if(seen[key]) return;
  seen[key]=1; views[key]=(views[key]||0)+1;
  try{ localStorage.setItem(VKEY,JSON.stringify(views)); sessionStorage.setItem(SKEY,JSON.stringify(seen)); }catch(e){}
}
function isNew(dateStr){
  if(!dateStr) return false;
  const m=dateStr.match(/^(\d{4})(?:-(\d{2}))?/); if(!m) return false;
  const d=new Date(+m[1], m[2]? (+m[2]-1) : 0, 1);   // 월은 0부터라 -1
  return (Date.now()-d.getTime()) < 60*24*3600*1000 && d.getTime()<=Date.now()+31*24*3600*1000;
}
function fmtDate(d){ return d ? d.replace("-", ".") : ""; }

/* ---------- 헤더 / About ---------- */
$("#brand").innerHTML = SITE.name.replace(/\s(\S+)$/," <em>$1</em>");
$("#heroName").textContent = SITE.name;
(function heroKo(){
  const box=$("#heroKo"); box.innerHTML="";
  if(SITE.nameKo){ const n=el("span","nm"); n.textContent=SITE.nameKo; box.appendChild(n); }
  if(SITE.nameKo && SITE.email) box.appendChild(el("i","sep"));
  if(SITE.email){ const m=el("button","mail"); m.type="button"; m.textContent=SITE.email;
    m.title="클릭하면 복사됩니다"; m.onclick=copyMail; box.appendChild(m); }
})();
$("#heroRole").textContent = SITE.role;
(function heroTag(){
  const box=$("#heroTag"); box.innerHTML="";
  [].concat(SITE.tagline||[]).forEach(t=>{ const n=el("span"); n.textContent=t; box.appendChild(n); });
})();
$("#yr").textContent = new Date().getFullYear();
$("#ftName").textContent = SITE.name;
if(SITE.favicon){
  const lk=el("link"); lk.rel="icon"; lk.href=enc(SITE.favicon); document.head.appendChild(lk);
}
(function heroLoad(){
  const im=$("#heroImg");
  if(SITE.hero){ im.onload=()=>im.classList.add("ready"); im.src=enc(SITE.hero); }
  if(!SITE.heroVideo) return;
  const DELAY = (SITE.heroVideoDelay!=null ? SITE.heroVideoDelay : 1500);  // 재생까지 기다리는 시간(ms)
  const v=el("video");
  v.muted=true; v.defaultMuted=true; v.loop=true; v.playsInline=true;
  ["muted","loop","playsinline"].forEach(a=>v.setAttribute(a,""));
  v.preload="auto";
  if(SITE.hero) v.poster=enc(SITE.hero);
  /* 실제로 재생이 시작될 때 화면을 넘겨받습니다 (그 전까지는 정지 이미지) */
  v.onplaying=()=>{ v.classList.add("ready"); im.classList.remove("ready"); };
  v.onerror=()=>{ v.remove(); if(SITE.hero) im.classList.add("ready"); };
  v.src=enc(SITE.heroVideo);
  $("#heroMedia").appendChild(v);
  v.load();
  const tryPlay=()=>{ const g=v.play(); if(g && g.catch) g.catch(()=>{}); };
  setTimeout(tryPlay, DELAY);
  /* 브라우저가 자동재생을 막았다면 첫 조작 때 다시 시도합니다 */
  ["pointerdown","keydown","touchstart"].forEach(ev=>
    window.addEventListener(ev, function once(){ tryPlay();
      ["pointerdown","keydown","touchstart"].forEach(e2=>window.removeEventListener(e2, once)); },
      {once:true, passive:true}));
})();

/* --- About : 프로필 --- */
(function aboutWho(){
  const P = SITE.profile || {}, box = $("#aboutWho");
  const h = el("h3"); h.textContent = P.nameEn || SITE.name || "";
  if(P.nameKo){ const k=el("span"); k.textContent=P.nameKo; h.appendChild(k); }
  box.appendChild(h);
  if(P.role){ const r=el("p","role"); r.textContent=P.role; box.appendChild(r); }
  if(P.focus){ const f=el("p","focus"); f.textContent=P.focus; box.appendChild(f); }

  const meta=el("div","meta"); let any=false;
  if(P.born){ const b=el("span"); b.textContent=P.born; meta.appendChild(b); any=true; }
  if(SITE.email){
    if(any) meta.appendChild(el("i","dot"));
    const m=el("button","linkbtn"); m.type="button"; m.textContent=SITE.email;
    m.title="클릭하면 복사됩니다"; m.onclick=copyMail; meta.appendChild(m); any=true;
  }
  (SITE.links||[]).filter(l=>l.url).forEach(l=>{
    if(any) meta.appendChild(el("i","dot"));
    const a=el("a","linkbtn"); a.href=l.url; a.target="_blank"; a.rel="noopener";
    a.textContent=l.label; meta.appendChild(a); any=true;
  });
  if(any) box.appendChild(meta);

  if(P.photo){
    const fig=$("#portrait"), im=$("#aboutPhoto");
    im.alt=(P.nameEn||"")+" 프로필 사진";
    im.onload=()=>{ fig.hidden=false; im.classList.add("ready"); };
    im.onerror=()=>{ fig.remove(); };          // 사진 파일이 없으면 조용히 사라집니다
    im.src=enc(P.photo);
  } else $("#portrait").remove();
})();

(SITE.about||[]).forEach(t=>{
  const p=el("p");
  String(t).split("\n").forEach((line,i)=>{           // \n 은 줄바꿈으로
    if(i) p.appendChild(el("br"));
    p.appendChild(document.createTextNode(line));
  });
  $("#aboutCopy").appendChild(p);
});

/* --- About : Education / Skills / Awards --- */
function fillList(sel, rows){
  const ul=$(sel); const list=rows||[];
  if(!list.length){ ul.closest(".col").remove(); return; }
  list.forEach(r=>{
    const li=el("li");
    const w=el("span","when"); w.textContent=r.when||"";
    const t=el("span"); t.textContent=r.what||"";
    li.append(w,t); ul.appendChild(li);
  });
}
fillList("#aboutEdu", SITE.education);
fillList("#aboutAwards", SITE.awards);
(function skills(){
  const box=$("#aboutSkills"), sets=SITE.skills||[];
  if(!sets.length){ box.closest(".col").remove(); return; }
  sets.forEach(s=>{
    const d=el("div","skillset");
    if(s.group){ const b=el("b"); b.textContent=s.group; d.appendChild(b); }
    /* 제품명이 줄 중간에서 안 끊기도록 이름 안쪽 공백은 줄바꿈 없는 공백으로 */
    const p=el("p");
    p.textContent=(s.items||[]).map(t=>t.replace(/ /g,"\u00A0")).join(" · ");
    d.appendChild(p);
    box.appendChild(d);
  });
})();

/* ---------- 푸터 버튼 ---------- */
(function(){
  const wrap=$("#ftActs");
  const mail=el("button"); mail.textContent="Email ✉"; mail.onclick=copyMail; wrap.appendChild(mail);
  (SITE.links||[]).filter(l=>l.url).forEach(l=>{
    const a=el("a"); a.href=l.url; a.target="_blank"; a.rel="noopener"; a.textContent=l.label; wrap.appendChild(a);
  });
})();

/* ---------- 그리드 + 무한 스크롤 ---------- */
const grid=$("#grid"), sentinel=$("#sentinel");
const PAGE=9;
let pool=[], shown=0, busy=false;

/* separate:true 인 카테고리는 Works 에서 빼고 아래 별도 섹션으로 보냅니다 */
function visible(){ return WORKS.filter(w=>!w.cat.separate); }

function renderGrid(){
  pool=visible(); shown=0; grid.innerHTML="";
  const imgs=pool.reduce((a,w)=>a+w.images.length,0);
  $("#workCount").textContent = pool.length+" projects · "+nImg(imgs);
  if(!pool.length){ const d=el("div","empty"); d.textContent="표시할 작업이 없습니다."; grid.appendChild(d); return; }
  appendMore(); appendMore();
}
function appendMore(){
  if(busy || shown>=pool.length) return;
  busy=true;
  const frag=document.createDocumentFragment();
  const end=Math.min(shown+PAGE, pool.length);
  for(let i=shown;i<end;i++) frag.appendChild(makeCard(pool[i]));
  grid.appendChild(frag); shown=end; busy=false;
}
function makeCard(w){
  const b=el("button","card");
  b.type="button";
  b.setAttribute("aria-label", w.title+" 크게 보기");
  const img=el("img"); img.alt=w.title; img.loading="lazy"; img.decoding="async";
  img.onload=()=>img.classList.add("ready");
  img.onerror=()=>{ const o=origSrc(w.cat,w.group,w.cover); if(img.getAttribute("src")!==o) img.src=o; };
  img.src=w.coverSrc;

  const badges=el("div","badges");
  if(isNew(w.date)){ const t=el("span","tag new"); t.textContent="New"; badges.appendChild(t); }
  const v=views[w.id]||0;
  if(v>=10){ const t=el("span","tag"); t.textContent=v+" views"; badges.appendChild(t); }

  const meta=el("div","meta");
  const d=el("span","date"); d.textContent=fmtDate(w.date) || w.cat.label;
  const t=el("span","title"); t.textContent=w.title;
  const s=el("span","sub");
  /* 별도 섹션 안에서는 카테고리 이름이 제목에 이미 있으므로 생략합니다 */
  s.textContent=(w.cat.separate ? "" : w.cat.label+" · ")+nImg(w.images.length);
  meta.append(d,t,s);

  b.append(img,badges,meta);
  b.onclick=()=>openLB(w,0);
  return b;
}
renderGrid();

/* ---------- 별도 섹션 (Designer 등) ---------- */
(function buildSeparate(){
  const host=$("#sepSections");
  CATEGORIES.filter(c=>c.separate).forEach(cat=>{
    const items=WORKS.filter(w=>w.cat.id===cat.id);
    if(!items.length) return;

    const sec=el("section","section"); sec.id=cat.id;
    const head=el("div","section-head");
    const h=el("h2"); h.textContent=cat.label;
    const cnt=el("span","count");
    const total=items.reduce((a,w)=>a+w.images.length,0);
    cnt.textContent = cat.tiles ? nImg(total) : items.length+" projects · "+nImg(total);
    head.append(h,cnt); sec.appendChild(head);

    if(cat.tiles){
      const box=el("div","tiles");
      items.forEach(w=>w.images.forEach((im,i)=>{
        const b=el("button","tile"); b.type="button";
        b.setAttribute("aria-label", w.title+" "+(i+1)+"번째 이미지 크게 보기");
        const img=el("img"); img.alt=""; img.loading="lazy"; img.decoding="async";
        img.onload=()=>img.classList.add("ready");
        img.onerror=()=>{ if(img.getAttribute("src")!==im.orig) img.src=im.orig; };
        img.src=im.thumb;
        b.appendChild(img);
        const vs=(w.group.variants||{})[im.file];
        if(vs && vs.length>1){
          const m=el("span","vmark");
          const n=el("span"); n.textContent=vs.length+" colors"; m.appendChild(n);
          b.appendChild(m);
        }
        b.onclick=()=>openLB(w,i);
        box.appendChild(b);
      }));
      sec.appendChild(box);
    }else{
      const box=el("div","grid");
      items.forEach(w=>box.appendChild(makeCard(w)));
      sec.appendChild(box);
    }
    host.appendChild(sec);

    /* 상단 메뉴에도 추가 */
    const nav=document.querySelector(".nav");
    const btn=el("button"); btn.dataset.go=cat.id; btn.textContent=cat.label;
    nav.appendChild(btn);
  });
})();

if("IntersectionObserver" in window){
  new IntersectionObserver(es=>{ if(es[0].isIntersecting) appendMore(); },{rootMargin:"600px 0px"}).observe(sentinel);
}else{
  window.addEventListener("scroll",()=>{
    if(sentinel.getBoundingClientRect().top < window.innerHeight+600) appendMore();
  },{passive:true});
}

/* ---------- 라이트박스 ---------- */
const lb=$("#lb"), lbFrame=$("#lbFrame"), lbRail=$("#lbRail");
let set=[], pos=0, lastFocus=null;

function openLB(w, imgIndex){
  lastFocus=document.activeElement;
  set = FLAT[w.cat.id];
  pos = set.findIndex(x=>x.work===w && x.i===imgIndex);
  if(pos<0) pos=0;
  lb.classList.add("open"); document.body.classList.add("locked");
  paint(); $("#lbStage").focus();
}
function closeLB(){
  resetZoom();
  lb.classList.remove("open"); document.body.classList.remove("locked");
  clearFrame();
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
/* 이미지 이동 : 지금 보고 있는 작업 안에서만, 끝에서는 멈춥니다 */
function stepImage(d){
  if(!set.length) return;
  const w=set[pos].work;
  const first=set.findIndex(x=>x.work===w);
  const last =first + w.images.length - 1;
  const next=pos+d;
  if(next<first || next>last) return;      // 다른 작업으로 넘어가지 않습니다
  pos=next; paint();
}
/* 작업 이동 : Previous / Next 버튼 전용 */
function stepWork(d){
  if(!set.length) return;
  const ws=[]; set.forEach(x=>{ if(ws[ws.length-1]!==x.work) ws.push(x.work); });
  const w=set[pos].work;
  const i=ws.indexOf(w);
  const target=ws[(i + d + ws.length) % ws.length];
  const p=set.findIndex(x=>x.work===target);
  if(p>=0){ pos=p; paint(); }
}
function step(d){
  if(!set.length) return;
  pos = (pos + d + set.length) % set.length;
  paint();
}
const pick={};          /* 색 버전 선택 기억 (파일별) */

/* ---------- 눌러서 확대 (300%) + 드래그 이동 ---------- */
const ZOOM=3;
let zoomed=false, dragging=false, sx=0, sy=0, tx=0, ty=0;
function curImg(){ return lbFrame.querySelector("img"); }   /* 영상에는 확대가 없습니다 */

/* object-fit:contain 으로 실제로 그려지는 크기 */
function shownSize(img){
  const bw=img.clientWidth, bh=img.clientHeight;
  const nw=img.naturalWidth||bw, nh=img.naturalHeight||bh;
  if(!bw||!bh||!nw||!nh) return {w:bw,h:bh};
  const r=Math.min(bw/nw, bh/nh);
  return {w:nw*r, h:nh*r};
}
function clampT(img){
  const s2=shownSize(img);
  const mx=(ZOOM-1)*s2.w/2, my=(ZOOM-1)*s2.h/2;
  tx=Math.max(-mx,Math.min(mx,tx));
  ty=Math.max(-my,Math.min(my,ty));
}
function applyT(img){ img.style.transform="translate("+tx+"px,"+ty+"px) scale("+ZOOM+")"; }

function zoomOn(e){
  const img=curImg(); if(!img) return;
  const r=img.getBoundingClientRect();
  const px=e.clientX-(r.left+r.width/2), py=e.clientY-(r.top+r.height/2);
  tx=(1-ZOOM)*px; ty=(1-ZOOM)*py;
  clampT(img);
  zoomed=true; dragging=true; sx=e.clientX; sy=e.clientY;
  img.style.transition="";                 /* 확대는 부드럽게 */
  img.classList.add("zoom");
  applyT(img);
}
function zoomMove(e){
  if(!dragging) return;
  const img=curImg(); if(!img) return;
  img.style.transition="opacity .3s";      /* 끄는 동안에는 손끝을 그대로 따라오게 */
  tx+=e.clientX-sx; ty+=e.clientY-sy;
  sx=e.clientX; sy=e.clientY;
  clampT(img); applyT(img);
}
function zoomOff(){
  const img=curImg();
  dragging=false; zoomed=false; tx=0; ty=0;
  if(img){ img.style.transition=""; img.classList.remove("zoom"); img.style.transform=""; }
}
function resetZoom(){ dragging=false; zoomed=false; tx=0; ty=0; }

lbFrame.addEventListener("pointerdown", e=>{
  const img=curImg();
  if(!img || e.target!==img || (e.pointerType==="mouse" && e.button!==0)) return;
  e.preventDefault();
  try{ img.setPointerCapture(e.pointerId); }catch(_){}
  zoomOn(e);
});
lbFrame.addEventListener("pointermove", e=>{ if(dragging){ e.preventDefault(); zoomMove(e); } });
["pointerup","pointercancel"].forEach(t=>{
  lbFrame.addEventListener(t, ()=>{ if(zoomed) zoomOff(); });
  window.addEventListener(t, ()=>{ if(zoomed) zoomOff(); });
});
lbFrame.addEventListener("mouseleave", ()=>{ if(zoomed) zoomOff(); });

/* 이미지를 화면에 꽉 차게 맞추고, 그 폭을 버튼 줄에도 알려 줍니다 */
const lbStage=$("#lbStage");
function fitMedia(){
  const m=lbFrame.querySelector("img,video");
  if(!m){ lbStage.style.setProperty("--mw","100%"); return; }
  const W=lbFrame.clientWidth, H=lbFrame.clientHeight;
  if(!W||!H) return;
  const nw=m.naturalWidth||m.videoWidth||0, nh=m.naturalHeight||m.videoHeight||0;
  let w=W, h=H;
  if(nw&&nh){
    const r=nw/nh;
    w=Math.min(W, H*r); h=w/r;
    if(h>H){ h=H; w=h*r; }
  }
  m.style.width=Math.round(w)+"px";
  m.style.height=Math.round(h)+"px";
  lbStage.style.setProperty("--mw", Math.round(w)+"px");
}
const syncBars=fitMedia;

function fitAll(){ fitMedia(); }
window.addEventListener("resize", fitAll);

function clearFrame(){
  lbFrame.querySelectorAll("img,video").forEach(n=>{ if(n.pause) n.pause(); n.remove(); });
}
function showMedia(w, entry, file){
  clearFrame();
  const spin=$("#lbSpin"); spin.textContent="Loading…"; spin.style.display="block";

  if(entry.isVideo){
    const v=el("video");
    v.controls=true; v.autoplay=true; v.loop=true; v.muted=true; v.defaultMuted=true; v.playsInline=true;
    ["muted","autoplay","loop","playsinline"].forEach(a=>v.setAttribute(a,""));
    v.preload="auto";
    if(entry.orig) v.poster=entry.thumb;
    v.oncanplay=()=>{ v.classList.add("ready"); spin.style.display="none"; fitMedia(); };
    v.onloadedmetadata=fitMedia;
    v.onerror=()=>{ spin.textContent="영상을 불러오지 못했습니다"; };
    v.src=entry.src;
    lbFrame.appendChild(v);
    const go=v.play(); if(go && go.catch) go.catch(()=>{});
    return;
  }

  const img=el("img"); img.alt=w.title+" — "+file; img.decoding="async";
  const fallback = (file===entry.file) ? entry.orig : null;
  img.onload=()=>{ img.classList.add("ready"); spin.style.display="none"; fitMedia(); requestAnimationFrame(fitMedia); };
  img.onerror=()=>{
    if(fallback && img.getAttribute("src")!==fallback){ img.src=fallback; }
    else { spin.textContent="이미지를 불러오지 못했습니다"; }
  };
  img.src=fullSrc(w.cat, w.group, file);
  img.draggable=false;
  lbFrame.appendChild(img);
}

function paint(){
  const cur=set[pos]; if(!cur) return;
  const w=cur.work;
  bump(w.id);
  resetZoom();

  const vs=(w.group.variants||{})[cur.img.file];
  const curFile = (vs && pick[cur.img.file]) || cur.img.file;
  showMedia(w, cur.img, curFile);

  /* 색 전환 버튼 */
  const box=$("#lbVars"); box.innerHTML="";
  if(vs && vs.length>1){
    vs.forEach(v=>{
      const b=el("button"); b.type="button"; b.textContent=v.label||v.file;
      b.classList.toggle("on", v.file===curFile);
      b.onclick=()=>{ pick[cur.img.file]=v.file; paint(); };
      box.appendChild(b);
    });
  }

  $("#lbCat").textContent   = w.cat.label;
  $("#lbTitle").textContent = w.title;
  $("#lbDate").textContent  = fmtDate(w.date);
  /* 카운터는 이 작업 안에서의 순서 (오른쪽 썸네일 목록과 같은 기준) */
  const pad2=n=>String(n).padStart(2,"0");
  $("#lbIdx").textContent   = pad2(cur.i+1)+" / "+pad2(w.images.length);
  const vc=views[w.id]||0;
  $("#lbViews").textContent = vc>=10 ? vc+" views" : "";

  /* 설명 · 정보 */
  (function desc(){
    const box=$("#lbDesc"); box.innerHTML="";
    const raw=(w.group.desc||"").trim(); if(!raw) return;
    let big=false, first=true;
    raw.split("\n").forEach(line=>{
      if(!line.trim()){ big=true; return; }
      const s=el("span","line");
      if(!first) s.classList.add(big ? "gap-lg" : "gap-sm");
      s.textContent=line.trim();
      box.appendChild(s); first=false; big=false;
    });
  })();
  const sp=$("#lbSpecs"); sp.innerHTML="";
  (w.group.info||[]).forEach(r=>{
    if(!r || !r.v) return;
    const row=el("div"), dt=el("dt"), dd=el("dd");
    dt.textContent=r.k||""; dd.textContent=r.v;
    row.append(dt,dd); sp.appendChild(row);
  });

  buildRail(w, cur.i);
  $("#lbSide").scrollTop=0; $(".lb-info").scrollTop=0;
}
let railFor=null;
/* 썸네일 이름 : labels 에 적어 두면 그 글자, 없으면 파일 이름에서 만듭니다 */
function shotLabel(w, im){
  if(im.label) return im.label;
  const L=(w.group.labels||{})[im.file];
  if(L) return L;
  return im.file.split("/").pop().replace(/\.[^.]+$/,"").replace(/[_-]+/g," ").trim();
}
function buildRail(w, idx){
  if(railFor!==w.id){
    railFor=w.id; lbRail.innerHTML="";
    w.images.forEach((im,i)=>{
      const b=el("button"); b.type="button"; b.dataset.i=i;
      const sh=el("span","sh");
      const t=el("img"); t.alt=""; t.loading="lazy"; t.draggable=false; t.src=im.thumb;
      t.onerror=()=>{ if(t.getAttribute("src")!==im.orig) t.src=im.orig; };
      sh.appendChild(t);
      if(im.isVideo) b.classList.add("vid");
      b.title=shotLabel(w, im);
      b.append(sh);
      b.onclick=()=>{ const p=set.findIndex(x=>x.work===w && x.i===i); if(p>=0){ pos=p; paint(); } };
      lbRail.appendChild(b);
    });
  }
  lbRail.querySelectorAll("button").forEach(b=>b.classList.toggle("on", +b.dataset.i===idx));
  const on=lbRail.querySelector("button.on");
  if(on) on.scrollIntoView({block:"nearest"});
}

/* 썸네일 목록 : 끌어서 넘겨 볼 수 있습니다 */
(function(){
  let on=false, startY=0, startX=0, top0=0, left0=0, moved=0;
  lbRail.addEventListener("dragstart", e=>e.preventDefault());   /* 이미지가 끌려 나가지 않도록 */
  lbRail.addEventListener("pointerdown", e=>{
    if(e.pointerType==="mouse" && e.button!==0) return;
    on=true; moved=0;
    startY=e.clientY; startX=e.clientX;
    top0=lbRail.scrollTop; left0=lbRail.scrollLeft;
  });
  window.addEventListener("pointermove", e=>{
    if(!on) return;
    const dy=e.clientY-startY, dx=e.clientX-startX;
    moved=Math.max(moved, Math.abs(dy), Math.abs(dx));
    if(moved>4){
      lbRail.classList.add("dragging");
      lbRail.scrollTop = top0-dy; lbRail.scrollLeft = left0-dx;
    }
  });
  ["pointerup","pointercancel"].forEach(t=>{
    window.addEventListener(t, ()=>{ on=false; lbRail.classList.remove("dragging"); });
  });
  /* 끌어 넘긴 뒤에는 클릭으로 처리하지 않습니다 */
  lbRail.addEventListener("click", e=>{
    if(moved>6){ e.stopPropagation(); e.preventDefault(); }
    moved=0;
  }, true);
})();

$("#lbClose").onclick=closeLB;
$("#lbPrev").onclick=()=>stepWork(-1);
$("#lbNext").onclick=()=>stepWork(1);
lb.addEventListener("click",e=>{ if(e.target===lb || e.target===$("#lbStage") || e.target===lbFrame) closeLB(); });

document.addEventListener("keydown",e=>{
  if(!lb.classList.contains("open")) return;
  if(e.key==="Escape"){ if(zoomed) zoomOff(); else closeLB(); }
  else if(e.key==="ArrowRight"){ if(!zoomed) stepImage(1); }
  else if(e.key==="ArrowLeft"){ if(!zoomed) stepImage(-1); }
});

let wheelLock=0;
$("#lbStage").addEventListener("wheel",e=>{
  e.preventDefault();
  if(zoomed) return;                       // 확대 중에는 이동하지 않습니다
  const now=Date.now(); if(now-wheelLock<260) return;
  wheelLock=now; stepImage(e.deltaY>0 ? 1 : -1);
},{passive:false});

/* ---------- 이메일 복사 / 토스트 ---------- */
function copyMail(){
  const t=SITE.email;
  const done=()=>toast("이메일 주소를 복사했습니다 — "+t);
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(done).catch(()=>fallback(t,done));
  } else fallback(t,done);
}
function fallback(t,done){
  const ta=el("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ toast(t); }
  ta.remove();
}
let toastT=null;
function toast(msg){
  const n=$("#toast"); n.textContent=msg; n.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>n.classList.remove("show"),1900);
}

/* ---------- 네비 / 맨 위로 ---------- */
document.querySelectorAll("[data-go]").forEach(b=>{
  b.onclick=()=>{
    const t=document.getElementById(b.dataset.go);
    if(t) t.scrollIntoView({behavior:"smooth", block:"start"});
  };
});
const totop=$("#totop");
totop.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
window.addEventListener("scroll",()=>{
  totop.classList.toggle("show", window.scrollY>700);
  const y=window.scrollY+120;
  const ids=["about","works"].concat(CATEGORIES.filter(c=>c.separate).map(c=>c.id));
  let on="";
  ids.forEach(id=>{ const n=document.getElementById(id); if(n && n.offsetTop<=y) on=id; });
  document.querySelectorAll("[data-go]").forEach(b=>b.classList.toggle("on", b.dataset.go===on));
},{passive:true});
})();
</script>
