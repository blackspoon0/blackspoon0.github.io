<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cho Eunseo — 3D Portfolio</title>
<meta name="description" content="3D 아티스트 조은서의 포트폴리오. 하드서피스 프롭, 환경 애셋, 스컬프트 작업 아카이브.">
<meta property="og:title" content="Cho Eunseo — 3D Portfolio">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17191b; --bg-deep:#0e0f10; --panel:#1f2225; --panel-2:#25292d;
  --line:#33383d; --line-soft:#282c30;
  --ink:#eceae6; --ink-dim:#b4b8bb; --muted:#83888e;
  --accent:#7fb8c4; --accent-deep:#2e4950;
  --pad:clamp(18px,4vw,64px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Archivo","Noto Sans KR",system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
body.locked{overflow:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:12px;z-index:200;background:var(--panel);padding:10px 14px;border:1px solid var(--line)}

/* ---------- topbar ---------- */
.topbar{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;align-items:center;gap:20px;
  padding:14px var(--pad);backdrop-filter:blur(14px);
  background:linear-gradient(180deg,rgba(14,15,16,.94),rgba(14,15,16,0))}
.brand{font-weight:800;letter-spacing:.16em;font-size:14px}
.brand em{font-style:normal;color:var(--accent)}
.nav{display:flex;gap:18px;margin-left:auto;font-size:13px;letter-spacing:.08em;color:var(--ink-dim);text-transform:uppercase}
.nav button{padding:4px 0;border-bottom:1px solid transparent;transition:.15s}
.nav button:hover,.nav button.on{color:var(--ink);border-bottom-color:var(--accent)}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden}
.hero-media{position:absolute;inset:0;background:#0c0d0e}
.hero-media img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.1s ease;filter:saturate(.82) contrast(1.04)}
.hero-media img.ready{opacity:.55}
.hero-media::after{content:"";position:absolute;inset:0;
  background:radial-gradient(130% 95% at 76% 14%,rgba(0,0,0,0) 0%,rgba(12,13,14,.7) 60%,#141618 100%)}
.hero-inner{position:relative;padding:0 var(--pad) clamp(46px,9vh,104px);max-width:1560px;width:100%}
.hero h1{margin:0;font-size:clamp(46px,11.5vw,150px);line-height:.86;font-weight:800;letter-spacing:-.035em;text-transform:uppercase}
.hero .ko{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:16px;font-size:14.5px;color:var(--ink-dim)}
.hero .ko .nm{letter-spacing:.24em}
.hero .ko .sep{width:1px;height:13px;background:var(--line);flex:none}
.hero .ko .mail{padding:0;color:var(--muted);letter-spacing:.01em;border-bottom:1px solid transparent;transition:.16s}
.hero .ko .mail:hover{color:var(--accent);border-bottom-color:var(--accent-deep)}
.hero .role{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 22px;margin-top:26px}
.hero .role b{flex:none;margin-top:5px;font-weight:600;color:var(--accent);letter-spacing:.14em;text-transform:uppercase;font-size:12.5px}
.hero .role .htag{font-size:16.5px;line-height:1.55;color:var(--ink-dim);letter-spacing:.005em;max-width:60ch}
.hero .role .htag span{display:block;white-space:nowrap}
@media(max-width:560px){.hero .ko .sep{display:none}.hero .role .htag{font-size:14.5px}.hero .role .htag span{white-space:normal}}
.hero-scroll{margin-top:32px;font-size:12px;letter-spacing:.14em;color:var(--muted);display:flex;align-items:center;gap:12px;text-transform:uppercase}
.hero-scroll i{display:block;width:44px;height:1px;background:var(--muted)}

/* ---------- sections ---------- */
.section{padding:clamp(56px,9vh,120px) var(--pad);max-width:1560px;margin:0 auto;scroll-margin-top:64px}
.section-head{display:flex;align-items:baseline;gap:16px;margin-bottom:32px;border-bottom:1px solid var(--line-soft);padding-bottom:14px}
.section-head h2{margin:0;font-size:clamp(22px,3vw,32px);font-weight:600;letter-spacing:-.01em}
.section-head .count{font-size:12px;letter-spacing:.1em;color:var(--muted);margin-left:auto;text-transform:uppercase}

/* ---------- about ---------- */
.linkbtn{border-bottom:1px solid var(--accent-deep);transition:.15s}
.linkbtn:hover{border-bottom-color:var(--accent);color:var(--accent)}

/* 프로필 + 소개문 */
.about-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.portrait{margin:0;width:clamp(120px,13vw,176px);aspect-ratio:1;border-radius:50%;overflow:hidden;
  background:var(--panel);border:1px solid var(--line-soft);flex:none}
.portrait img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
.portrait img.ready{opacity:1}
.who h3{margin:0;font-size:clamp(22px,2.4vw,30px);font-weight:600;letter-spacing:-.015em}
.who h3 span{color:var(--muted);font-weight:400;font-size:.62em;letter-spacing:.12em;margin-left:10px;
  vertical-align:.14em}
.who .role{margin:8px 0 0;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.who .focus{margin:6px 0 0;font-size:14px;color:var(--muted);word-break:keep-all}
.who .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:14px 0 0;font-size:14px;color:var(--ink-dim)}
.who .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--line);flex:none}
.about-copy{margin-top:26px}
.about-copy p{margin:0 0 16px;max-width:42em;color:var(--ink);font-size:clamp(17px,1.4vw,19.5px);
  line-height:1.85;word-break:keep-all}
.about-copy br{line-height:0}
.about-copy p:last-child{margin-bottom:0}

/* Education / Skills / Awards */
.about-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(22px,3.5vw,56px);
  margin-top:clamp(40px,6vh,72px);padding-top:clamp(28px,4vh,44px);border-top:1px solid var(--line-soft)}
.col h4{margin:0 0 16px;font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.col ul{margin:0;padding:0;list-style:none}
.col li{display:flex;gap:14px;padding:7px 0;font-size:14.5px;color:var(--ink-dim);word-break:keep-all}
.col li .when{flex:none;width:60px;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13.5px;padding-top:1px}
.skillset{margin-bottom:18px}
.skillset:last-child{margin-bottom:0}
.skillset b{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin-bottom:7px;opacity:.85}
.skillset p{margin:0;font-size:14.5px;line-height:1.7;color:var(--ink-dim)}
@media(max-width:900px){.about-cols{grid-template-columns:1fr 1fr}.col.awards{grid-column:1/-1}}
@media(max-width:620px){
  .about-top{grid-template-columns:1fr;gap:22px}
  .about-cols{grid-template-columns:1fr;gap:34px}
  .col.awards{grid-column:auto}
}

/* ---------- works ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.chip{padding:7px 15px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--ink-dim);transition:.16s}
.chip:hover{border-color:var(--accent-deep);color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#0f272c;font-weight:600}
.chip small{opacity:.6;margin-left:6px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:clamp(10px,1.3vw,18px)}
@media(max-width:520px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.card{position:relative;display:block;width:100%;padding:0;border:1px solid var(--line-soft);
  background:var(--panel);overflow:hidden;aspect-ratio:4/3;text-align:left}
.card::before{content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,#22262a,#1a1d20);}
.card img{position:relative;width:100%;height:100%;object-fit:cover;opacity:0;
  transition:transform .55s cubic-bezier(.2,.7,.3,1),opacity .45s}
.card img.ready{opacity:1}
.card:hover img,.card:focus-visible img{transform:scale(1.05)}
.card .meta{position:absolute;inset:auto 0 0 0;padding:38px 14px 12px;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,11,12,0),rgba(10,11,12,.92))}
.card .date{display:block;font-size:11px;letter-spacing:.14em;color:var(--accent);
  text-transform:uppercase;opacity:0;transform:translateY(6px);transition:.25s}
.card:hover .date,.card:focus-visible .date{opacity:1;transform:none}
.card .title{display:block;font-size:15px;font-weight:600;letter-spacing:.01em;margin-top:2px}
.card .sub{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.06em;margin-top:2px}
.card .badges{position:absolute;top:10px;left:10px;display:flex;gap:6px}
.tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;
  background:rgba(10,11,12,.72);border:1px solid var(--line);color:var(--ink-dim)}
.tag.new{background:var(--accent);border-color:var(--accent);color:#0f272c;font-weight:700}
.sentinel{height:60px}
.empty{padding:40px 0;color:var(--muted);font-size:14px}

/* ---------- footer ---------- */
.footer{border-top:1px solid var(--line-soft);padding:34px var(--pad) 46px;max-width:1560px;margin:0 auto;
  display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;font-size:13px;color:var(--muted)}
.footer .acts{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.footer .acts button,.footer .acts a{border:1px solid var(--line);padding:8px 16px;border-radius:999px;
  color:var(--ink-dim);font-size:13px;transition:.16s}
.footer .acts button:hover,.footer .acts a:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:120;display:none;background:rgba(8,9,10,.965);backdrop-filter:blur(6px)}
.lb.open{display:flex}
.lb-stage{position:relative;flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:56px 60px 78px}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity .3s}
.lb-stage img.ready{opacity:1}
.lb-frame{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.lb-spin{position:absolute;font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.lb-close{position:absolute;top:14px;right:16px;z-index:5;width:40px;height:40px;font-size:20px;
  border:1px solid var(--line);border-radius:50%;color:var(--ink-dim);transition:.16s}
.lb-close:hover{border-color:var(--accent);color:var(--accent)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:46px;height:70px;font-size:28px;
  color:var(--ink-dim);background:rgba(20,22,24,.5);border:1px solid var(--line-soft);transition:.16s}
.lb-nav:hover{color:var(--accent);border-color:var(--accent-deep);background:rgba(20,22,24,.85)}
.lb-prev{left:8px} .lb-next{right:8px}
.lb-cap{position:absolute;left:0;right:0;bottom:0;padding:14px 60px 18px;display:flex;gap:14px;
  align-items:baseline;font-size:13px;color:var(--muted);
  background:linear-gradient(180deg,rgba(8,9,10,0),rgba(8,9,10,.9))}
.lb-cap b{color:var(--ink);font-weight:600;font-size:15px}
.lb-cap .cat{letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:var(--accent)}
.lb-cap .idx{margin-left:auto;font-variant-numeric:tabular-nums;letter-spacing:.08em}
.lb-hint{position:absolute;top:16px;left:20px;font-size:11px;letter-spacing:.1em;color:#5f656b;text-transform:uppercase}
.lb-rail{width:132px;flex:none;overflow-y:auto;padding:56px 12px 20px;border-left:1px solid var(--line-soft);
  display:flex;flex-direction:column;gap:8px;background:rgba(15,16,17,.6)}
.lb-rail button{border:1px solid transparent;aspect-ratio:4/3;overflow:hidden;background:var(--panel);flex:none}
.lb-rail button img{width:100%;height:100%;object-fit:cover;opacity:.5;transition:.2s}
.lb-rail button:hover img{opacity:.85}
.lb-rail button.on{border-color:var(--accent)}
.lb-rail button.on img{opacity:1}
@media(max-width:820px){
  .lb-rail{display:none}
  .lb-stage{padding:52px 12px 72px}
  .lb-cap{padding:12px 16px 16px}
  .lb-nav{width:38px;height:58px;font-size:22px}
}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);z-index:200;
  background:#fff;color:#15181a;padding:16px 30px;border-radius:6px;font-size:14.5px;font-weight:600;
  box-shadow:0 22px 60px rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:.22s ease}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.totop{position:fixed;right:20px;bottom:20px;z-index:55;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--line);background:rgba(20,22,24,.85);color:var(--ink-dim);
  opacity:0;pointer-events:none;transition:.2s}
.totop.show{opacity:1;pointer-events:auto}
.totop:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<a class="skip" href="#works">본문으로 건너뛰기</a>

<header class="topbar">
  <div class="brand" id="brand"></div>
  <nav class="nav">
    <button data-go="about">About</button>
    <button data-go="works">Works</button>
    <button data-go="contact">Contact</button>
  </nav>
</header>

<section class="hero" id="top">
  <div class="hero-media"><img id="heroImg" alt=""></div>
  <div class="hero-inner">
    <h1 id="heroName"></h1>
    <div class="ko" id="heroKo"></div>
    <div class="role"><b id="heroRole"></b><span class="htag" id="heroTag"></span></div>
    <div class="hero-scroll"><i></i><span>Scroll</span></div>
  </div>
</section>

<section class="section" id="about">
  <div class="section-head"><h2>About</h2></div>
  <div class="about-top">
    <figure class="portrait" id="portrait" hidden><img id="aboutPhoto" alt=""></figure>
    <div>
      <div class="who" id="aboutWho"></div>
      <div class="about-copy" id="aboutCopy"></div>
    </div>
  </div>
  <div class="about-cols">
    <div class="col"><h4>Education</h4><ul id="aboutEdu"></ul></div>
    <div class="col"><h4>Skills</h4><div id="aboutSkills"></div></div>
    <div class="col awards"><h4>Awards</h4><ul id="aboutAwards"></ul></div>
  </div>
</section>

<section class="section" id="works">
  <div class="section-head">
    <h2>Works</h2>
    <span class="count" id="workCount"></span>
  </div>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <div class="sentinel" id="sentinel"></div>
</section>

<footer class="footer" id="contact">
  <div>© <span id="yr"></span> <span id="ftName"></span> — 모든 이미지의 권리는 작성자에게 있습니다.</div>
  <div class="acts" id="ftActs"></div>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="작업 보기">
  <div class="lb-stage" id="lbStage" tabindex="-1">
    <span class="lb-hint">← → / 휠 이동 · ESC 닫기</span>
    <button class="lb-close" id="lbClose" aria-label="닫기">✕</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="이전">‹</button>
    <button class="lb-nav lb-next" id="lbNext" aria-label="다음">›</button>
    <div class="lb-frame" id="lbFrame"><span class="lb-spin" id="lbSpin">Loading…</span></div>
    <div class="lb-cap">
      <span class="cat" id="lbCat"></span><b id="lbTitle"></b><span id="lbDate"></span>
      <span class="idx" id="lbIdx"></span>
    </div>
  </div>
  <div class="lb-rail" id="lbRail"></div>
</div>

<button class="totop" id="totop" aria-label="맨 위로">↑</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script>
(function(){
"use strict";
const $  = s => document.querySelector(s);
const el = (t,c) => { const n=document.createElement(t); if(c) n.className=c; return n; };
const enc = p => p.split("/").map(encodeURIComponent).join("/");
const useThumbs = (typeof USE_THUMBS!=="undefined") && USE_THUMBS;
const useWeb    = (typeof USE_WEB!=="undefined")    && USE_WEB;
const dirThumb  = (typeof THUMB_DIR!=="undefined")  ? THUMB_DIR : "thumbs";
const dirWeb    = (typeof WEB_DIR!=="undefined")    ? WEB_DIR   : "web";

/* ---------- 경로 ---------- */
function joinDir(cat,g){ return g.folder ? cat.dir + "/" + g.folder : cat.dir; }
function relDir(cat,g){ return joinDir(cat,g).replace(/^images\//,""); }
function jpgName(file){ return file.replace(/\.[^.]+$/,"") + ".jpg"; }
/* 원본 (images/…) — 축소본이 없을 때의 예비용 */
function origSrc(cat,g,file){ return enc(joinDir(cat,g) + "/" + file); }
/* 라이트박스용 (web/…) */
function fullSrc(cat,g,file){
  return useWeb ? enc(dirWeb + "/" + relDir(cat,g) + "/" + jpgName(file)) : origSrc(cat,g,file);
}
/* 카드·썸네일용 (thumbs/…) */
function thumbSrc(cat,g,file){
  return useThumbs ? enc(dirThumb + "/" + relDir(cat,g) + "/" + jpgName(file)) : origSrc(cat,g,file);
}

/* ---------- 작업 목록 만들기 ---------- */
const WORKS = [];
CATEGORIES.forEach(cat=>{
  (cat.groups||[]).forEach((g,gi)=>{
    if(!g.files || !g.files.length) return;
    const cover = g.cover && g.files.indexOf(g.cover)>=0 ? g.cover : g.files[0];
    WORKS.push({
      id: cat.id+"/"+(g.folder||"_")+"/"+gi,
      cat, group:g,
      title: g.title || g.folder || cat.label,
      date: g.date || "",
      sort: (g.date||"0000").replace("-",""),
      cover,
      coverSrc: thumbSrc(cat,g,cover),
      images: g.files.map(f=>({ file:f, src:fullSrc(cat,g,f), thumb:thumbSrc(cat,g,f), orig:origSrc(cat,g,f) }))
    });
  });
});
WORKS.sort((a,b)=> b.sort.localeCompare(a.sort));

/* 카테고리별 이미지 평면 목록 (라이트박스 이동용) */
const FLAT = {};
CATEGORIES.forEach(c=>{ FLAT[c.id]=[]; });
WORKS.forEach(w=>{ w.images.forEach((im,i)=> FLAT[w.cat.id].push({work:w, img:im, i})); });

/* ---------- 조회수 (브라우저 저장, 서버 없음) ---------- */
const VKEY="cho_views", SKEY="cho_seen";
let views={}, seen={};
try{ views=JSON.parse(localStorage.getItem(VKEY)||"{}"); }catch(e){}
try{ seen =JSON.parse(sessionStorage.getItem(SKEY)||"{}"); }catch(e){}
function bump(key){
  if(seen[key]) return;
  seen[key]=1; views[key]=(views[key]||0)+1;
  try{ localStorage.setItem(VKEY,JSON.stringify(views)); sessionStorage.setItem(SKEY,JSON.stringify(seen)); }catch(e){}
}
function isNew(dateStr){
  if(!dateStr) return false;
  const m=dateStr.match(/^(\d{4})(?:-(\d{2}))?/); if(!m) return false;
  const d=new Date(+m[1], m[2]? (+m[2]-1) : 0, 1);   // 월은 0부터라 -1
  return (Date.now()-d.getTime()) < 60*24*3600*1000 && d.getTime()<=Date.now()+31*24*3600*1000;
}
function fmtDate(d){ return d ? d.replace("-", ".") : ""; }

/* ---------- 헤더 / About ---------- */
$("#brand").innerHTML = SITE.name.replace(/\s(\S+)$/," <em>$1</em>");
$("#heroName").textContent = SITE.name;
(function heroKo(){
  const box=$("#heroKo"); box.innerHTML="";
  if(SITE.nameKo){ const n=el("span","nm"); n.textContent=SITE.nameKo; box.appendChild(n); }
  if(SITE.nameKo && SITE.email) box.appendChild(el("i","sep"));
  if(SITE.email){ const m=el("button","mail"); m.type="button"; m.textContent=SITE.email;
    m.title="클릭하면 복사됩니다"; m.onclick=copyMail; box.appendChild(m); }
})();
$("#heroRole").textContent = SITE.role;
(function heroTag(){
  const box=$("#heroTag"); box.innerHTML="";

/* --- About : 프로필 --- */
(function aboutWho(){
  const P = SITE.profile || {}, box = $("#aboutWho");
  const h = el("h3"); h.textContent = P.nameEn || SITE.name || "";
  if(P.nameKo){ const k=el("span"); k.textContent=P.nameKo; h.appendChild(k); }
  box.appendChild(h);
  if(P.role){ const r=el("p","role"); r.textContent=P.role; box.appendChild(r); }
  if(P.focus){ const f=el("p","focus"); f.textContent=P.focus; box.appendChild(f); }

  const meta=el("div","meta"); let any=false;
  if(P.born){ const b=el("span"); b.textContent=P.born; meta.appendChild(b); any=true; }
  if(SITE.email){
    if(any) meta.appendChild(el("i","dot"));
    const m=el("button","linkbtn"); m.type="button"; m.textContent=SITE.email;
    m.title="클릭하면 복사됩니다"; m.onclick=copyMail; meta.appendChild(m); any=true;
  }
  (SITE.links||[]).filter(l=>l.url).forEach(l=>{
    if(any) meta.appendChild(el("i","dot"));
    const a=el("a","linkbtn"); a.href=l.url; a.target="_blank"; a.rel="noopener";
    a.textContent=l.label; meta.appendChild(a); any=true;
  });
  if(any) box.appendChild(meta);

  if(P.photo){
    const fig=$("#portrait"), im=$("#aboutPhoto");
    im.alt=(P.nameEn||"")+" 프로필 사진";
    im.onload=()=>{ fig.hidden=false; im.classList.add("ready"); };
    im.onerror=()=>{ fig.remove(); };          // 사진 파일이 없으면 조용히 사라집니다
    im.src=enc(P.photo);
  } else $("#portrait").remove();
})();

(SITE.about||[]).forEach(t=>{
  const p=el("p");
  String(t).split("\n").forEach((line,i)=>{           // \n 은 줄바꿈으로
    if(i) p.appendChild(el("br"));
    p.appendChild(document.createTextNode(line));
  });
  $("#aboutCopy").appendChild(p);
});

/* --- About : Education / Skills / Awards --- */
function fillList(sel, rows){
  const ul=$(sel); const list=rows||[];
  if(!list.length){ ul.closest(".col").remove(); return; }
  list.forEach(r=>{
    const li=el("li");
    const w=el("span","when"); w.textContent=r.when||"";
    const t=el("span"); t.textContent=r.what||"";
    li.append(w,t); ul.appendChild(li);
  });
}
fillList("#aboutEdu", SITE.education);
fillList("#aboutAwards", SITE.awards);
(function skills(){
  const box=$("#aboutSkills"), sets=SITE.skills||[];
  if(!sets.length){ box.closest(".col").remove(); return; }
  sets.forEach(s=>{
    const d=el("div","skillset");
    if(s.group){ const b=el("b"); b.textContent=s.group; d.appendChild(b); }
    /* 제품명이 줄 중간에서 안 끊기도록 이름 안쪽 공백은 줄바꿈 없는 공백으로 */
    const p=el("p");
    p.textContent=(s.items||[]).map(t=>t.replace(/ /g,"\u00A0")).join(" · ");
    d.appendChild(p);
    box.appendChild(d);
  });
})();

/* ---------- 필터 ---------- */
let filter="ALL";
(function buildFilters(){
  const box=$("#filters");
  const mk=(id,label,n)=>{
    const b=el("button","chip"); b.dataset.f=id;
    b.innerHTML=label+' <small>'+n+'</small>';
    b.onclick=()=>{ filter=id; syncChips(); renderGrid(); };
    box.appendChild(b);
  };
  mk("ALL","All", WORKS.length);
  CATEGORIES.forEach(c=>{
    const n=WORKS.filter(w=>w.cat.id===c.id).length;
    if(n) mk(c.id, c.label, n);
  });
  syncChips();
})();
function syncChips(){
  document.querySelectorAll(".chip").forEach(b=>b.classList.toggle("on", b.dataset.f===filter));
}

/* ---------- 그리드 + 무한 스크롤 ---------- */
const grid=$("#grid"), sentinel=$("#sentinel");
const PAGE=9;
let pool=[], shown=0, busy=false;

function visible(){ return filter==="ALL" ? WORKS : WORKS.filter(w=>w.cat.id===filter); }

function renderGrid(){
  pool=visible(); shown=0; grid.innerHTML="";
  const imgs=pool.reduce((a,w)=>a+w.images.length,0);
  $("#workCount").textContent = pool.length+" projects · "+imgs+" images";
  if(!pool.length){ const d=el("div","empty"); d.textContent="표시할 작업이 없습니다."; grid.appendChild(d); return; }
  appendMore(); appendMore();
}
function appendMore(){
  if(busy || shown>=pool.length) return;
  busy=true;
  const frag=document.createDocumentFragment();
  const end=Math.min(shown+PAGE, pool.length);
  for(let i=shown;i<end;i++) frag.appendChild(makeCard(pool[i]));
  grid.appendChild(frag); shown=end; busy=false;
}
function makeCard(w){
  const b=el("button","card");
  b.type="button";
  b.setAttribute("aria-label", w.title+" 크게 보기");
  const img=el("img"); img.alt=w.title; img.loading="lazy"; img.decoding="async";
  img.onload=()=>img.classList.add("ready");
  img.onerror=()=>{ const o=origSrc(w.cat,w.group,w.cover); if(img.getAttribute("src")!==o) img.src=o; };
  img.src=w.coverSrc;

  const badges=el("div","badges");
  if(isNew(w.date)){ const t=el("span","tag new"); t.textContent="New"; badges.appendChild(t); }
  const v=views[w.id]||0;
  if(v>=10){ const t=el("span","tag"); t.textContent=v+" views"; badges.appendChild(t); }

  const meta=el("div","meta");
  const d=el("span","date"); d.textContent=fmtDate(w.date) || w.cat.label;
  const t=el("span","title"); t.textContent=w.title;
  const s=el("span","sub");  s.textContent=w.cat.label+" · "+w.images.length+" images";
  meta.append(d,t,s);

  b.append(img,badges,meta);
  b.onclick=()=>openLB(w,0);
  return b;
}
renderGrid();

if("IntersectionObserver" in window){
  new IntersectionObserver(es=>{ if(es[0].isIntersecting) appendMore(); },{rootMargin:"600px 0px"}).observe(sentinel);
}else{
  window.addEventListener("scroll",()=>{
    if(sentinel.getBoundingClientRect().top < window.innerHeight+600) appendMore();
  },{passive:true});
}

/* ---------- 라이트박스 ---------- */
const lb=$("#lb"), lbFrame=$("#lbFrame"), lbRail=$("#lbRail");
let set=[], pos=0, lastFocus=null;

function openLB(w, imgIndex){
  lastFocus=document.activeElement;
  set = FLAT[w.cat.id];
  pos = set.findIndex(x=>x.work===w && x.i===imgIndex);
  if(pos<0) pos=0;
  lb.classList.add("open"); document.body.classList.add("locked");
  paint(); $("#lbStage").focus();
}
function closeLB(){
  lb.classList.remove("open"); document.body.classList.remove("locked");
  lbFrame.querySelectorAll("img").forEach(n=>n.remove());
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
function step(d){
  if(!set.length) return;
  pos = (pos + d + set.length) % set.length;
  paint();
}
function paint(){
  const cur=set[pos]; if(!cur) return;
  const w=cur.work;
  bump(w.id);

  lbFrame.querySelectorAll("img").forEach(n=>n.remove());
  $("#lbSpin").style.display="block";
  const img=el("img"); img.alt=w.title+" — "+cur.img.file; img.decoding="async";
  img.onload=()=>{ img.classList.add("ready"); $("#lbSpin").style.display="none"; };
  img.onerror=()=>{ if(img.getAttribute("src")!==cur.img.orig){ img.src=cur.img.orig; } else { $("#lbSpin").textContent="이미지를 불러오지 못했습니다"; } };
  img.src=cur.img.src;
  lbFrame.appendChild(img);

  $("#lbCat").textContent   = w.cat.label;
  $("#lbTitle").textContent = w.title;
  $("#lbDate").textContent  = fmtDate(w.date);
  $("#lbIdx").textContent   = (pos+1)+" / "+set.length;

  buildRail(w, cur.i);
}
let railFor=null;
function buildRail(w, idx){
  if(railFor!==w.id){
    railFor=w.id; lbRail.innerHTML="";
    w.images.forEach((im,i)=>{
      const b=el("button"); b.type="button"; b.dataset.i=i;
      const t=el("img"); t.alt=""; t.loading="lazy"; t.src=im.thumb;
      t.onerror=()=>{ if(t.getAttribute("src")!==im.orig) t.src=im.orig; };
      b.appendChild(t);
      b.onclick=()=>{ const p=set.findIndex(x=>x.work===w && x.i===i); if(p>=0){ pos=p; paint(); } };
      lbRail.appendChild(b);
    });
  }
  lbRail.querySelectorAll("button").forEach(b=>b.classList.toggle("on", +b.dataset.i===idx));
  const on=lbRail.querySelector("button.on");
  if(on) on.scrollIntoView({block:"nearest"});
}

$("#lbClose").onclick=closeLB;
$("#lbPrev").onclick=()=>step(-1);
$("#lbNext").onclick=()=>step(1);
lb.addEventListener("click",e=>{ if(e.target===lb || e.target===$("#lbStage") || e.target===lbFrame) closeLB(); });

document.addEventListener("keydown",e=>{
  if(!lb.classList.contains("open")) return;
  if(e.key==="Escape"){ closeLB(); }
  else if(e.key==="ArrowRight"){ step(1); }
  else if(e.key==="ArrowLeft"){ step(-1); }
});

let wheelLock=0;
$("#lbStage").addEventListener("wheel",e=>{
  e.preventDefault();
  const now=Date.now(); if(now-wheelLock<260) return;
  wheelLock=now; step(e.deltaY>0 ? 1 : -1);
},{passive:false});

/* ---------- 이메일 복사 / 토스트 ---------- */
function copyMail(){
  const t=SITE.email;
  const done=()=>toast("이메일 주소를 복사했습니다 — "+t);
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(t).then(done).catch(()=>fallback(t,done));
  } else fallback(t,done);
}
function fallback(t,done){
  const ta=el("textarea"); ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ toast(t); }
  ta.remove();
}
let toastT=null;
function toast(msg){
  const n=$("#toast"); n.textContent=msg; n.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>n.classList.remove("show"),1900);
}

/* ---------- 네비 / 맨 위로 ---------- */
document.querySelectorAll("[data-go]").forEach(b=>{
  b.onclick=()=>{
    const t=document.getElementById(b.dataset.go);
    if(t) t.scrollIntoView({behavior:"smooth", block:"start"});
  };
});
const totop=$("#totop");
totop.onclick=()=>window.scrollTo({top:0,behavior:"smooth"});
window.addEventListener("scroll",()=>{
  totop.classList.toggle("show", window.scrollY>700);
  const y=window.scrollY+120;
  const ids=["about","works","contact"];
  let on="";
  ids.forEach(id=>{ const n=document.getElementById(id); if(n && n.offsetTop<=y) on=id; });
  document.querySelectorAll("[data-go]").forEach(b=>b.classList.toggle("on", b.dataset.go===on));
},{passive:true});
})();
